<section class="contato-section">

  <h1 class="section-title" id="contato">Contato</h1>

  <div class="contato-grid">

    <!-- Canais de contato -->
    <div class="contato-canais">

      <h2>Vamos conversar</h2>
      <p class="contato-texto">
        Tem um projeto ou uma vaga em mente? Respondo mais rápido pelo
        WhatsApp, mas qualquer canal funciona.
      </p>

      <ul class="canais-lista">
        @for (canal of canais; track canal.nome) {
          <li>
            <a
              class="canal"
              [href]="canal.link"
              target="_blank"
              rel="noopener noreferrer">

              <i [class]="canal.icone" aria-hidden="true"></i>

              <span class="canal-info">
                <span class="canal-nome">{{ canal.nome }}</span>
                <span class="canal-valor">{{ canal.valor }}</span>
              </span>

              <i class="fa-solid fa-arrow-up-right-from-square canal-seta" aria-hidden="true"></i>

            </a>
          </li>
        }
      </ul>

    </div>

    <!-- Formulário -->
    <form class="contato-form" (ngSubmit)="enviarMensagem()">

      <div class="campo">
        <label for="contato-nome">Seu nome</label>
        <input
          id="contato-nome"
          type="text"
          name="nome"
          placeholder="Como posso te chamar?"
          [(ngModel)]="nome"
          required />
      </div>

      <div class="campo">
        <label for="contato-mensagem">Mensagem</label>
        <textarea
          id="contato-mensagem"
          name="mensagem"
          rows="6"
          placeholder="Conte um pouco sobre o que você precisa"
          [(ngModel)]="mensagem"
          required></textarea>
      </div>

      <button
        type="submit"
        class="btn-enviar"
        [disabled]="!nome.trim() || !mensagem.trim()">
        <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
        Enviar pelo WhatsApp
      </button>

      <p class="form-ajuda">
        A mensagem abre no WhatsApp já preenchida, é só confirmar o envio.
      </p>

    </form>

  </div>

</section>
