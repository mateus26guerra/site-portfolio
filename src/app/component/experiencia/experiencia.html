<section class="timeline-wrap">

  <h2 class="section-title">
    Minha Jornada
  </h2>

  <div class="timeline">

    <div
      class="timeline-item"
      *ngFor="let exp of experiencias; let i = index"
      [class.left]="i % 2 === 0"
      [class.right]="i % 2 !== 0"
      [class.atual]="exp.periodoFim === 'Atualmente'">

      <!-- Logo -->
      <div class="timeline-circle">
        <div class="logo-circle">
          <img
            [src]="exp.logo"
            [alt]="exp.empresa">
        </div>
      </div>

      <!-- Card -->
      <article class="card">

        <div class="card-topo">
          <span class="date-label">
            <i class="fa-regular fa-calendar" aria-hidden="true"></i>
            {{ exp.periodoInicio }} até {{ exp.periodoFim | lowercase }}
          </span>

          <span class="badge-atual" *ngIf="exp.periodoFim === 'Atualmente'">Atual</span>
        </div>

        <h3 class="card-title">
          {{ exp.empresa }}
        </h3>

        <p class="card-cargo">
          {{ exp.cargo }}
        </p>

        <p class="card-text">
          {{ exp.descricao }}
        </p>

        <div class="card-tecnologias">
          <img
            class="tech-icons"
            [src]="'https://skillicons.dev/icons?i=' + exp.tecnologias"
            [alt]="'Tecnologias usadas na ' + exp.empresa"
            loading="lazy">
        </div>

      </article>

    </div>

  </div>

</section>
